[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragnar-rag"
version = "0.1.0"
description = "A modular, production-ready, bring-your-own-model RAG framework."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "docling[easyocr]>=2.114.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "jinja2>=3.1",
    "loguru>=0.7.3",
    "pre-commit>=4.6.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "redis>=5.0",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.61.1",
    "uvicorn>=0.52.3",
]

[project.optional-dependencies]
evals = [
    "ragas>=0.3",
    "langchain-ollama>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["ragnar"]
artifacts = ["ragnar/prompts/*.j2"]

[tool.mypy]
explicit_package_bases = true
mypy_path = "."
