services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - LLM_MODEL=${LLM_MODEL:-gemma2:2b}
    entrypoint: /bin/sh -c "ollama serve & sleep 2 && ollama pull ${LLM_MODEL:-gemma2:2b} && wait"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    mem_limit: 2g
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379
      - HF_TOKEN=${HF_TOKEN:-}
      - FASTEMBED_CACHE_PATH=/models/fastembed
      - HF_HOME=/models/hf
      - MALLOC_ARENA_MAX=2
      - TOKENIZERS_PARALLELISM=false
    depends_on:
      - ollama
      - qdrant
      - redis
    volumes:
      - ./ragnar:/app/ragnar:ro
      - C:/Users/aster/Desktop/ragnar_papers:/docs:ro
      - model_cache:/models

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - API_URL=http://api:8000
    volumes:
      - ./ragnar:/app/ragnar:ro

  indexer:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: on-failure
    command: ["python", "-m", "ragnar.indexing.worker"]
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - HF_TOKEN=${HF_TOKEN:-}
      - INDEX_BATCH_SIZE=${INDEX_BATCH_SIZE:-8}
      - DENSE_EMBED_BATCH_SIZE=${DENSE_EMBED_BATCH_SIZE:-4}
      - DENSE_EMBED_THREADS=${DENSE_EMBED_THREADS:-2}
      - SPARSE_EMBED_BATCH_SIZE=${SPARSE_EMBED_BATCH_SIZE:-4}
      - SPARSE_EMBED_THREADS=${SPARSE_EMBED_THREADS:-2}
      - FASTEMBED_CACHE_PATH=/models/fastembed
      - HF_HOME=/models/hf
      - DOCLING_ARTIFACTS_PATH=/models/docling
      - MALLOC_ARENA_MAX=2
      - TOKENIZERS_PARALLELISM=false
      - DOCLING_DO_OCR=${DOCLING_DO_OCR:-false}
      - DOCLING_BATCH_SIZE=${DOCLING_BATCH_SIZE:-1}
      - DOCLING_NUM_THREADS=${DOCLING_NUM_THREADS:-2}
      - INDEX_SPOOL_DIR=/var/lib/ragnar/index-spool
    depends_on:
      - qdrant
      - redis
    volumes:
      - ./ragnar:/app/ragnar:ro
      - model_cache:/models
      - index_spool:/var/lib/ragnar/index-spool
      - C:/Users/aster/Desktop/ragnar_papers:/docs:ro

volumes:
  ollama_data:
  qdrant_data:
  redis_data:
  model_cache:
  index_spool:
